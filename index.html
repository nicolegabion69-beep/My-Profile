<!DOCTYPE html>
<html>
<head>
    <title>Justine's Profile</title>

    <style>
        /* Styles the whole webpage */
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f2ff;
            text-align: center;
        }

        /* Profile Box */
        .profile-box {

            /* Width - controls the width of the box */
            width: 350px;

            /* Padding - creates space inside the box */
            padding: 30px;

            /* Border - creates a blue border around the box */
            border: 4px solid #3399ff;

            /* Margin - creates space outside the box */
            margin: 50px auto;

            /* Background Color - changes the box background */
            background-color: #f0f8ff;

            text-align: center;

            /* Makes the corners rounded */
            border-radius: 20px;

            /* Adds a soft shadow */
            box-shadow: 0 5px 15px #99ccff;
        }

        h1 {
            color: #0066cc;
        }

        p {
            font-size: 16px;
            color: #244a66;
        }
    </style>
</head>
